name: CourtSimplified story pack

# The story pack (tests/browser/story-pack.spec.ts): 30 made-up stories, each run in a
# real browser through the questions and through the review panel, then the next step,
# the follow-up chat and the case page. Every check asserts a property (no internal
# wording, no doubled full stop, the side named, the amount owed never a fee...).
#
# Run before any PR is marked ready (#470 re-test, 2026-10-23). No AI spend: the site's
# server calls are answered by this commit's own code. Staging only, like the browser
# regression job; its own job because it takes longer than that job's limit.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # At two speeds (site owner, 2026-10-26): instant, as the stubs answer, and the live site's real
  # speed (BROWSER_SPEED=slow: each analysis held 20 s, each account and database call 1.5 s;
  # tests/browser/harness/speed.ts). Real speed takes about 4.3 times as long (#488's first run on
  # GitHub, 27 Oct: 0.32 min a test instant, 1.4 min slow), so it runs in six parts side by side.
  # The parts are split by TEST, not by file (--fully-parallel; workers stay 1, so nothing runs at
  # once): the story pack is one file, and split by file the first part got all 152 tests and was
  # cancelled at 90 min while the other three finished in two.
  story-pack:
    name: story-pack (${{ matrix.label }})
    runs-on: ubuntu-latest
    # 177 tests (28 Oct): about 60 min instant, so its limit is 120; each real-speed part, about 30
    # tests, about 45 min, so its limit of 90 is twice that.
    timeout-minutes: ${{ matrix.speed == 'slow' && 90 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { speed: instant, part: "1/1", label: instant }
          - { speed: slow, part: "1/6", label: slow-1 }
          - { speed: slow, part: "2/6", label: slow-2 }
          - { speed: slow, part: "3/6", label: slow-3 }
          - { speed: slow, part: "4/6", label: slow-4 }
          - { speed: slow, part: "5/6", label: slow-5 }
          - { speed: slow, part: "6/6", label: slow-6 }

    env:
      BROWSER_SPEED: ${{ matrix.speed }}
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refuse a production database
        run: node --import tsx scripts/walkthrough/guard.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Site access password for this run only
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "SITE_ACCESS_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Production build
        run: npm run build

      - name: Start the site
        run: |
          nohup npx next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3100; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "server did not start"; tail -50 server.log; exit 1

      - name: The story pack
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
          # This run's records folder (tests/browser/harness/packRecords.ts), kept as its own artifact below.
          STORY_PACK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:story-pack -- --shard=${{ matrix.part }} --fully-parallel

      - name: Keep the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # One artifact per run, attempt and part: the ask-once records (repeats), the claim-kind table
          # and the findings, never replaced by a later run (site owner, 2026-10-27). The instant
          # part holds the whole pack's repeat count; each slow part holds its own share.
          name: story-pack-records-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          path: |
            story-pack-records/**
            test-results/**/error-context.md
          retention-days: 14
          if-no-files-found: ignore
