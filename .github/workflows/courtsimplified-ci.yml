name: CourtSimplified CI

on:
  push:
    branches:
      - main
      - courtsimplified-current-work-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: 1

      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit --pretty false

      - name: Small Claims engine verification
        run: npm run test:small-claims

      - name: Case isolation verification
        run: npm run test:case-isolation

      - name: Court path classifier and scenario registry verification
        run: npm run test:scenario-registry

      - name: Reasoning contract verification
        run: npm run test:reasoning-contract

      - name: Case RLS policy contract verification
        run: npm run test:case-rls-contract

      - name: Server AI reasoning route contract verification
        run: npm run test:ai-route-contract

      - name: Authority knowledge bridge verification
        run: npm run test:authority-bridge

      - name: User-facing scenario library verification
        run: npm run test:user-facing-scenarios

      - name: Three-area production contract verification
        run: npm run test:three-area

      - name: Case outcome matrix verification
        run: npm run test:case-outcomes

      - name: Case simulation factory verification
        run: npm run test:case-simulations

      - name: Scenario matrix verification
        run: npm run test:scenario-matrix

      - name: Narrative prefill verification
        run: npm run test:narrative-prefill

      - name: Court path classifier verification
        run: npm run test:court-path-classifier

      - name: Forms selected-case isolation verification
        run: npm run test:forms-case-isolation

      - name: Generate-form authorization verification
        run: npm run test:generate-form-authorization

      - name: Ontario beta procedure bundle verification
        run: npm run test:ontario-beta-bundle

      - name: Cohort 2 catalogue normalization verification
        run: npm run test:cohort2-normalization

      - name: Cohort 2 split canonical identity verification
        run: npm run test:cohort2-split-identities

      - name: Account recovery UX verification
        run: npm run test:account-recovery-ux

      - name: Builder persistence reliability verification
        run: npm run test:builder-persistence

      - name: Court assistant chat hydration verification
        run: npm run test:chat-hydration

      - name: Shared procedural-stage conflict verification
        run: npm run test:procedural-stage-conflict

      - name: Workflow gating verification
        run: npm run test:workflow-gating

      - name: Overview issue and document label verification
        run: npm run test:overview-labels

      - name: Production build
        run: npm run build

      - name: AI Case Partner context verification
        run: npm run test:ai-context
