name: CourtSimplified CI

on:
  push:
    branches:
      - main
      - courtsimplified-current-work-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: 1

      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mutation tests (probe)
        run: |
          set +e
          npm run test:mutations > mut.log 2>&1
          code=$?
          grep -v -E "^\s*$" mut.log | tail -80 > tail.log
          python3 -c "
          import sys
          t=open('tail.log').read()
          t=t.replace('%','%25').replace('\r','').replace('\n','%0A')
          for i in range(0,len(t),3500):
              print('::warning title=mut'+str(i//3500)+'::'+t[i:i+3500])
          "
          grep -n -i -E "not caught|survived|FAIL|did not" mut.log | head -40 > bad.log
          t=$(python3 -c "print(open('bad.log').read().replace('%','%25').replace('\n','%0A'))")
          echo "::warning title=bad::$t"
          exit 0
