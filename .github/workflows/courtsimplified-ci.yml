name: CourtSimplified CI

on:
  push:
    branches:
      - main
      - courtsimplified-current-work-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: 1

      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit --pretty false

      - name: Intake request reliability
        run: npm run test:intake-requests

      - name: Explicit intake review and confirmation
        run: npm run test:intake-review

      - name: Case guidance requires confirmed current intake on the server
        run: npm run test:intake-guidance-gate

      - name: Intake persistence and account isolation
        run: npm run test:intake-recovery

      - name: Small Claims engine verification
        run: npm run test:small-claims


      - name: Court path classifier and scenario registry verification
        run: npm run test:scenario-registry

      - name: Routing rules fixed by law (construction liens, the $50,000 limit) win over the model
        run: npm run test:fixed-regimes

      - name: AI routes that need no sign-in are limited per visitor and by a daily ceiling
        run: npm run test:ai-rate-limit

      - name: Server errors are logged without anything that identifies a person
        run: npm run test:server-error-log

      - name: Deleting a case deletes its stored files, and only its owner's
        run: npm run test:case-file-cleanup

      - name: In-app deadline reminder
        run: npm run test:upcoming-deadline

      - name: "Intake start screens: fixed province, no duplicate court-type picker"
        run: npm run test:intake-start-screens

      - name: The user's own words shown back, and story dates offered for deadlines
        run: npm run test:user-story

      - name: The recorded amount set against the court's limits
        run: npm run test:amount-notes

      - name: One case record that every page reads (master plan Phase 1)
        run: npm run test:case-record

      - name: The next step comes first (master plan Phase 2)
        run: npm run test:next-step

      - name: The next step's form, fee, filing and service are sourced (master plan Phase 2)
        run: npm run test:next-step-practical

      - name: Where the site cannot help, it points to a person who can
        run: npm run test:help-at-limits

      - name: The ten held-back finish-line cases stay held back
        run: npm run test:held-back-cases

      - name: The case reader reports only the person's own words, and only suggests (master plan Phase 3)
        run: npm run test:case-reader

      - name: Two-year limit counted from an injury under the s. 5 (2) presumption
        run: npm run test:presumed-limitation

      - name: Written-notice step suggested before filing
        run: npm run test:notice-step

      - name: Responding-document drafts
        run: npm run test:responding-draft

      - name: Law as it read on a past date
        run: npm run test:historical-law

      - name: Every step leads to the next by a rule
        run: npm run test:stage-sequence

      - name: The law map is well-formed and judges no case
        run: npm run test:law-map

      - name: Source links name their law
        run: npm run test:source-link-labels

      - name: Reasoning contract verification
        run: npm run test:reasoning-contract

      - name: Case RLS policy contract verification
        run: npm run test:case-rls-contract

      # Builds a private Postgres from supabase/migrations/ and attacks every table,
      # view, function and the evidence bucket as anon, two users and the service role.
      # Uses the PostgreSQL the ubuntu runner ships; no Supabase project, no secrets.
      - name: RLS attack matrix (every table, every role)
        run: npm run test:rls-matrix

      - name: Server AI reasoning route contract verification
        run: npm run test:ai-route-contract

      - name: Authority knowledge bridge verification
        run: npm run test:authority-bridge

      - name: Authority seed registry integrity verification
        run: npm run test:authority-seed-integrity

      - name: User-facing scenario library verification
        run: npm run test:user-facing-scenarios

      - name: Three-area production contract verification
        run: npm run test:three-area

      - name: Case outcome matrix verification
        run: npm run test:case-outcomes

      - name: Case simulation factory verification
        run: npm run test:case-simulations

      - name: Scenario matrix verification
        run: npm run test:scenario-matrix

      - name: Narrative prefill verification
        run: npm run test:narrative-prefill

      - name: Court path classifier verification
        run: npm run test:court-path-classifier

      - name: Forms selected-case isolation verification
        run: npm run test:forms-case-isolation

      - name: Generate-form authorization verification
        run: npm run test:generate-form-authorization

      - name: Ontario beta procedure bundle verification
        run: npm run test:ontario-beta-bundle

      - name: Cohort 2 catalogue normalization verification
        run: npm run test:cohort2-normalization

      - name: Cohort 2 split canonical identity verification
        run: npm run test:cohort2-split-identities

      - name: Account recovery UX verification
        run: npm run test:account-recovery-ux

      - name: Builder persistence reliability verification
        run: npm run test:builder-persistence

      - name: Court assistant chat hydration verification
        run: npm run test:chat-hydration

      - name: Shared procedural-stage conflict verification
        run: npm run test:procedural-stage-conflict


      - name: Overview issue and document label verification
        run: npm run test:overview-labels

      - name: Intake question selector verification
        run: npm run test:select-questions

      - name: Intake coverage verification
        run: npm run test:intake-coverage

      - name: Catalogue verification log holds against the catalogue
        run: npm run test:catalogue-verified

      - name: Court decisions from CanLII follow CanLII's terms (attribution, isolation, no scraping, rate limit, works with no key)
        run: npm run test:canlii

      - name: Checked answers show only statements the official text supports
        run: npm run test:checked-answer

      - name: The front door reasons about the whole story and shows only checked law
        run: npm run test:case-understanding

      - name: The Small Claims limit is $50,000 everywhere, and the old limit appears nowhere
        run: npm run test:small-claims-limit

      - name: Law exam answer keys quote the law word for word
        run: npm run test:law-exam

      - name: Document types in code match the database's catalogue
        run: npm run test:workspace-catalogue

      - name: AI analysis cannot show an unsourced legal statement
        run: npm run test:grounded-analysis

      - name: Retrieval cuts the law where the law is cut, and cites only through the gate
        run: npm run test:corpus-retrieval

      - name: A plain explanation is shown only after an independent check
        run: npm run test:plain-explanations

      - name: Research step counts only answers code can find in the passage
        run: npm run test:research-step

      - name: A missing law becomes a verified source, or nothing
        run: npm run test:source-requests

      - name: Questions from the law are quoted, checked and neutral, or not asked
        run: npm run test:sourced-questions

      - name: The right municipality's law, and the 10-day notice shown first
        run: npm run test:municipal-notice-first

      - name: The Court Assistant shows the law on each question, quoted and checked
        run: npm run test:assistant-law

      - name: Switch-off path shows no model-written text
        run: npm run test:no-model-text-to-users

      - name: Claim-type catalogue and profiles agree
        run: npm run test:claim-types

      - name: Claim-type matcher still routes the reference stories
        run: npm run test:claim-type-matcher

      - name: Depth questions are well-formed and never grade a case
        run: npm run test:depth-questions

      - name: Every case-system module is reachable or declared dormant
        run: npm run test:reachability

      - name: Every model call site is declared and structured
        run: npm run test:output-guard

      - name: Open pathways have real content; closed ones say so
        run: npm run test:phase-scope

      - name: Unapproved capabilities are on only as flagged testing, behind the site password
        run: npm run test:a2i-scope

      - name: Connection notes quote their sources exactly
        run: npm run test:cross-forum-notes

      - name: Every official form is explained from the rules that name it
        run: npm run test:form-explanations

      - name: Glossary definitions are the law's own words
        run: npm run test:glossary

      - name: In-depth guides quote their sources and cite every paragraph
        run: npm run test:topic-guides

      - name: The public claims library shows only approved content
        run: npm run test:claim-library

      - name: Courthouse addresses and contacts match the court's pages
        run: npm run test:court-locations

      - name: Every procedural card and guide is in the review packet
        run: npm run test:inventory-coverage

      - name: Every Source link opens a public page
        run: npm run test:source-links

      - name: Every crisis helpline number is on its official page
        run: npm run test:crisis-numbers

      - name: The vendored law is unedited and current-consolidation
        run: npm run test:rules-corpus

      - name: The published stage answers are the promoted, gated set
        run: npm run test:published-library

      - name: Stage-independent answers rest on quoted sources
        run: npm run test:generic-library

      - name: AI model configuration verification
        run: npm run test:ai-models

      - name: Case strategy stays switched off, sourced, and never grades a case
        run: npm run test:strategy

      - name: OpenAI spending stays under control (no cache writes, daily limit, no repeat runs)
        run: npm run test:openai-cost

      # This suite makes real, billed OpenAI calls, so it needs the
      # OPENAI_API_KEY repository secret. Without the secret it cannot run at
      # all -- it failed in one second on 2026-09-28, the first time any CI run
      # got this far since it was added on 2026-09-07. Rather than fail every
      # push over a missing secret, it is skipped with a visible warning; with
      # the secret set it runs and fails on any real regression. It passed
      # 11/11 on the site owner's machine on 2026-09-28.
      - name: Safety pass regression -- key missing
        if: env.OPENAI_API_KEY == ''
        run: echo "::warning title=Safety regression not run::OPENAI_API_KEY repository secret is not set, so the real-AI safety suite was skipped. Run npm run test:safety-regression locally before shipping intake changes."

      # COST (2026-10-08): the only billed suite in CI runs only when the AI code
      # changed since it last passed (a marker keyed on that code), and only when
      # today's OpenAI spend is under $15 (scripts/ai/spendGuard.mjs).
      # Keyed on the files the suite actually runs (its import closure), not on
      # all of src/: a fee table or citation change re-ran 14 billed calls and,
      # with the OpenAI balance empty, failed a build the suite never reads
      # (2026-10-08). scripts/ai/importClosureHash.mjs.
      - name: Hash the code the safety regression runs
        id: safety-code
        if: env.OPENAI_API_KEY != ''
        run: echo "hash=$(node scripts/ai/importClosureHash.mjs scripts/verification/verifySafetyPassRegression.ts)" >> "$GITHUB_OUTPUT"

      - name: Safety regression already passed on this AI code?
        id: safety-passed
        if: env.OPENAI_API_KEY != ''
        uses: actions/cache/restore@v4
        with:
          path: .ai-passed
          key: ai-passed-safety-regression-${{ steps.safety-code.outputs.hash }}
          lookup-only: true

      - name: Check today's OpenAI spend
        id: spend
        if: env.OPENAI_API_KEY != '' && steps.safety-passed.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
        run: node scripts/ai/spendGuard.mjs

      # An empty OpenAI balance delays this check, it never waives it: no
      # pass is recorded, so it runs on the next build that has credit
      # (scripts/ai/openaiCredit.mjs, 2026-10-08).
      - name: Can the OpenAI account make a call?
        id: credit
        if: env.OPENAI_API_KEY != '' && steps.safety-passed.outputs.cache-hit != 'true'
        run: node scripts/ai/openaiCredit.mjs >> "$GITHUB_OUTPUT"

      - name: OpenAI balance empty -- safety regression postponed
        if: steps.credit.outputs.credit == 'no'
        run: echo "::warning title=Safety regression postponed::The OpenAI balance is empty, so the safety regression could not run. No pass is recorded; it runs on the next build with credit."

      - name: Safety pass regression (real OpenAI calls -- see file header)
        if: env.OPENAI_API_KEY != '' && steps.safety-passed.outputs.cache-hit != 'true' && steps.spend.outcome == 'success' && steps.credit.outputs.credit != 'no'
        # Its output is copied into the run's annotations when it fails: the
        # job log is not readable from every place the result is checked
        # (2026-10-09). The cases are fabricated stories; no key is printed.
        run: |
          set -o pipefail
          npm run test:safety-regression 2>&1 | tee /tmp/safety.log || {
            grep -E "FAIL|Error|error|429|quota|status" /tmp/safety.log | head -15 | sed 's/^/::error title=Safety regression::/'
            exit 1
          }

      - name: Record that the safety regression passed on this AI code
        if: env.OPENAI_API_KEY != '' && steps.safety-passed.outputs.cache-hit != 'true' && steps.spend.outcome == 'success' && steps.credit.outputs.credit != 'no'
        run: mkdir -p .ai-passed && date -u > .ai-passed/passed

      - if: env.OPENAI_API_KEY != '' && steps.safety-passed.outputs.cache-hit != 'true' && steps.spend.outcome == 'success' && steps.credit.outputs.credit != 'no'
        uses: actions/cache/save@v4
        with:
          path: .ai-passed
          key: ai-passed-safety-regression-${{ steps.safety-code.outputs.hash }}

      - name: Family role comes from the user's answer
        run: npm run test:family-role

      - name: Spelling check changes spelling only
        run: npm run test:tidy-wording

      - name: Starting documents only for the starting side
        run: npm run test:responding-side

      - name: Official forms watch parses and covers every form
        run: npm run test:official-forms

      - name: Case file summary sentence is well formed and carries no verdict
        run: npm run test:case-file-summary

      - name: Case position stores only what the user confirmed, and reaches the deadlines
        run: npm run test:case-position

      - name: Every case write the builder, case and Forms pages start goes through one queue that cannot stall
        run: npm run test:case-write-queue

      - name: Drafts are saved on the user's own case and hold only their record
        run: npm run test:case-drafts

      - name: Every page that renders library text guards it, and every guard is declared
        run: npm run test:guard-coverage

      - name: Deadline engine counts every deadline correctly (holidays, weekends, month ends)
        run: npm run test:deadlines

      - name: Stage map quotes match the saved official text
        run: npm run test:stage-map

      - name: Every safety signal the intake can raise is covered
        run: npm run test:safety-coverage

      - name: Family and civil ask one question at a time, never one already answered
        run: npm run test:guided-form-chat

      - name: What the story already says is offered, not asked again; a served respondent is asked the day
        run: npm run test:story-answers

      - name: The statement-of-claim gate shows only sourced, neutral content
        run: npm run test:readiness-gate

      - name: Every provision a published answer was proved from is in its source list
        run: npm run test:verdict-sources

      - name: Service counts from the day the rules say, by how papers were served
        run: npm run test:service-dates

      - name: Free finish line (form, file/fee/service, counted deadline, no repeated date) stays at or above its floor
        run: npm run eval:free-finish-line

      - name: Production build
        run: npm run build

      - name: The deployed analysis routes ship the retrieval index and corpus
        run: npm run test:retrieval-bundled

      - name: AI Case Partner context verification
        run: npm run test:assistant-context

      # Last, because it edits source files on purpose (and restores them) to
      # prove each check can fail. Build order Step 1, 2026-10-12.
      # On failure the FAIL lines go up as annotations too, because the job
      # log is not readable from a Claude session (only annotations are).
      - name: Every check is proven able to fail (mutation tests)
        run: |
          set -o pipefail
          if npm run test:mutations 2>&1 | tee mutations.log; then exit 0; fi
          grep -A3 "^FAIL" mutations.log | head -60 | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'); print('::error title=Mutation tests failed::'+t)"
          exit 1

  # Added 2026-10-16, after a bug shipped through the front door
  # (HomeLocationGate -> CaseUnderstandingCard, 2026-10-14) that every
  # existing browser spec had zero chance of catching: they all navigate
  # straight to /builder, skipping the home page entirely. The specs this
  # job runs are deterministic (the AI call is mocked, or the spec needs no
  # AI call at all) -- no OpenAI spend, unlike courtsimplified-walkthrough.yml.
  #
  # NOT in the branch-protection required-check list yet, deliberately:
  # this job was written and wired up without a way to run it in this
  # sandbox (no network egress to npm or to the live site), so it is proven
  # correct by the mutation-style check described in each spec's own
  # comments, not by a local pass here. Once it has run clean on a few real
  # PRs, promoting it to a required check alongside typecheck-and-build is a
  # one-line change to the repo's ruleset.
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: 1
      # Staging only -- same reasoning as courtsimplified-walkthrough.yml. The
      # repository's NEXT_PUBLIC_SUPABASE_* secrets point at PRODUCTION, so the
      # STAGING_* secrets are read first and the guard step below refuses
      # production by ref if they're ever missing.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refuse a production database
        run: node --import tsx scripts/walkthrough/guard.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Same reasoning as courtsimplified-walkthrough.yml: the gate compares
      # a cookie to SITE_ACCESS_PASSWORD, so this run makes up its own,
      # masked, used only by this job's own server.
      - name: Site access password for this run only
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "SITE_ACCESS_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Production build
        run: npm run build

      - name: Start the site
        run: |
          nohup npx next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3100; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "server did not start"; tail -50 server.log; exit 1

      - name: Browser regressions found by hand in the front door (no AI spend)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
        run: >
          npx playwright test
          tests/browser/intake-reset.spec.ts
          tests/browser/case-understanding-continuity.spec.ts
          tests/browser/intake-reliability.spec.ts
          tests/browser/family-civil-intake-reliability.spec.ts
          tests/browser/intake-recovery.spec.ts
          tests/browser/intake-review.spec.ts
          tests/browser/intake-guidance-gate.spec.ts
          tests/browser/story-single-source.spec.ts
          tests/browser/guest-guidance.spec.ts
          tests/browser/intake-review-polish.spec.ts
          --reporter=line --workers=1

      # A failure that does not reproduce locally needs the page as CI saw it.
      # These specs use synthetic accounts only and keep traces off, so this
      # holds error-context snapshots, never a real session.
      - name: Keep failure snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-failures
          path: test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: ignore
