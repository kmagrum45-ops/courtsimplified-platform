name: CourtSimplified Coverage

# The coverage test (scripts/eval/coverageProbe.ts): about 150 fabricated
# stories across the three courts, both sides and the tribunals, through the
# real classifier, research step and questions from the law. Reports where
# the site falls short and which laws the library lacks. Publishes to the
# `coverage-reports` branch ("*-reports" is excluded from Vercel builds).
#
# On demand only: it makes roughly 1,500 model calls.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if this check already passed on the same code"
        required: false
        default: "no"
      only:
        description: "Comma-separated id prefixes to run (sc-, cv-, fm-), blank for all"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  # Skips the run when it already passed on exactly this code (2026-10-08):
  # a marker is saved after a pass, keyed on the code's contents.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: passed
        uses: actions/cache/restore@v4
        with:
          path: .ai-passed
          key: ai-passed-coverage-${{ hashFiles('src/**', 'app/**', 'scripts/**', 'package-lock.json') }}
          lookup-only: true
      - id: decide
        run: |
          if [ "${{ steps.passed.outputs.cache-hit }}" = "true" ] && [ "${{ inputs.force }}" != "yes" ]; then
            echo "::notice title=Already passed::This check already passed on this exact code; not run again (run with force=yes to override)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  coverage:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_CALL_LOG: file
      COVERAGE_ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Stops the run if today's OpenAI spend is over $15 (scripts/ai/spendGuard.mjs, 2026-10-08).
      - name: Check today's OpenAI spend
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
        run: node scripts/ai/spendGuard.mjs

      - run: npm ci

      - name: Coverage
        id: coverage
        continue-on-error: true
        run: |
          set -o pipefail
          npm run eval:coverage 2>&1 | tee coverage.log
          tail -1 coverage.log | sed 's/^/::notice title=Coverage::/'

      - name: Publish to coverage-reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cp coverage-report.md coverage.json coverage.log "$out/" 2>/dev/null || true
          printf 'branch: %s\ncommit: %s\ncoverage: %s\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${{ steps.coverage.outcome }}" > "$out/OUTCOME.txt"
          printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > "$out/vercel.json"
          cd "$out"
          git init -q
          git config user.name "coverage-bot"
          git config user.email "coverage-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Coverage for ${GITHUB_SHA::7} on ${GITHUB_REF_NAME} (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/coverage-reports
          head -12 coverage-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Record that this check passed on this code
        if: success()
        run: mkdir -p .ai-passed && date -u > .ai-passed/passed
      - if: success()
        uses: actions/cache/save@v4
        with:
          path: .ai-passed
          key: ai-passed-coverage-${{ hashFiles('src/**', 'app/**', 'scripts/**', 'package-lock.json') }}
