name: CourtSimplified Nightly Real-AI Integration

# Kept off push and pull_request deliberately. test:ai-real-integration makes
# real, billed OpenAI calls and its output is not deterministic, so it must not
# gate ordinary commits. It runs on a schedule and on demand instead.
#
# The script self-skips unless RUN_REAL_AI_INTEGRATION=1, so without that flag
# this job is a no-op rather than a silent pass.

# 2026-10-07: manual only. It spends the site's OpenAI balance, which ran
# low; start it from the Actions tab (or ask Claude) when a run is wanted.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if this check already passed on the same code"
        required: false
        default: "no"
jobs:
  # Skips the run when it already passed on exactly this code (2026-10-08):
  # a marker is saved after a pass, keyed on the code's contents.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: passed
        uses: actions/cache/restore@v4
        with:
          path: .ai-passed
          key: ai-passed-nightly-ai-${{ hashFiles('src/**', 'app/**', 'scripts/**', 'package-lock.json') }}
          lookup-only: true
      - id: decide
        run: |
          if [ "${{ steps.passed.outputs.cache-hit }}" = "true" ] && [ "${{ inputs.force }}" != "yes" ]; then
            echo "::notice title=Already passed::This check already passed on this exact code; not run again (run with force=yes to override)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  real-ai-integration:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: 1
      RUN_REAL_AI_INTEGRATION: "1"

      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Not a test of answer quality, so the model thinks less (2026-10-08); set
      # the repository variable AI_TEST_MODEL to use a cheaper model as well.
      AI_MODEL_DEEP: ${{ vars.AI_TEST_MODEL }}
      AI_MODEL_STANDARD: ${{ vars.AI_TEST_MODEL }}
      AI_EFFORT_DEEP: low
      AI_EFFORT_STANDARD: low

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Stops the run if today's OpenAI spend is over $15 (scripts/ai/spendGuard.mjs, 2026-10-08).
      - name: Check today's OpenAI spend
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
        run: node scripts/ai/spendGuard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Configured server AI integration check
        run: npm run test:ai-real-integration

      - name: Record that this check passed on this code
        if: success()
        run: mkdir -p .ai-passed && date -u > .ai-passed/passed
      - if: success()
        uses: actions/cache/save@v4
        with:
          path: .ai-passed
          key: ai-passed-nightly-ai-${{ hashFiles('src/**', 'app/**', 'scripts/**', 'package-lock.json') }}
