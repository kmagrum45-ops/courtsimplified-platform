# Temporary: side-by-side comparison of gpt-4o-mini vs the new tiered models.
# Saves reports to the ai-model-diagnostics-reports branch (no Actions log
# access needed). Delete this branch when done; never merge it.
name: AI model diagnostics
on:
  push:
    branches: [ai-model-diagnostics]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [an-none, an-luna]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pick models
        run: |
          if [ "${{ matrix.variant }}" = "an-none" ]; then echo "AI_EFFORT_ANALYSIS=none" >> $GITHUB_ENV; fi
          if [ "${{ matrix.variant }}" = "an-luna" ]; then echo "COURTSIMPLIFIED_REASONING_MODEL=gpt-6-luna" >> $GITHUB_ENV; fi
          if [ "${{ matrix.variant }}" = "old" ]; then
            echo "AI_MODEL_DEEP=gpt-4o-mini" >> $GITHUB_ENV
            echo "AI_MODEL_STANDARD=gpt-4o-mini" >> $GITHUB_ENV
          fi
      - name: Lift the journey timeout for measurement only
        run: sed -i 's/PIPELINE_JOURNEY_TIMEOUT_MS = 90_000/PIPELINE_JOURNEY_TIMEOUT_MS = 900_000/' scripts/verification/pipelineGuards.ts
      - name: Fixtures
        run: |
          start=$(date +%s); npm run test:fixtures > fixtures.log 2>&1 || echo "EXIT $?" >> fixtures.log
          echo "FIXTURES WALL SECONDS $(( $(date +%s) - start ))" >> fixtures.log
      - name: Publish
        run: |
          V=${{ matrix.variant }}
          mkdir -p out/$V
          cp story.log fixtures.log safety.log out/$V/ || true
          cp scripts/verification/storyReview/REPORT*.md scripts/verification/storyReview/results*.json out/$V/ || true
          mkdir -p out/$V/fixtures && cp scripts/verification/fixtures/*.actual.md out/$V/fixtures/ || true
          cp .ai-call-log.jsonl out/$V/ai-call-log.jsonl || true
          grep -rlE "sk-[A-Za-z0-9_-]{10,}" out && sed -i -E 's/sk-[A-Za-z0-9_-]{10,}/[redacted]/g' $(grep -rlE "sk-[A-Za-z0-9_-]{10,}" out) || true
          cd out && git init -q && git checkout -q -b r
          git -c user.name=ci -c user.email=ci@example.com add . && git -c user.name=ci -c user.email=ci@example.com commit -q -m "diagnostics $V"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" r:refs/heads/ai-diag-$V
