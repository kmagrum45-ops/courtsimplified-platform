# Temporary: runs the real-AI safety suite on this branch only and saves its
# output to the ai-model-diagnostics-reports branch so it can be read without
# Actions log access. Delete this branch when done; never merge it.
name: AI model diagnostics
on:
  push:
    branches: [ai-model-diagnostics]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Safety regression
        run: |
          for i in 1 2 3; do echo "=== RUN $i" >> safety.log; npm run test:safety-regression >> safety.log 2>&1 || echo "EXIT $?" >> safety.log; done
      - name: Publish log
        run: |
          mkdir -p out && mv safety.log out/
          sed -i -E 's/sk-[A-Za-z0-9_-]{10,}/[redacted]/g' out/safety.log
          cd out && git init -q && git checkout -q -b r
          git -c user.name=ci -c user.email=ci@example.com add . && git -c user.name=ci -c user.email=ci@example.com commit -q -m "diagnostics ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" r:refs/heads/ai-model-diagnostics-reports
