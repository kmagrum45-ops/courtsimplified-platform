name: CourtSimplified Source Requests

# A law the research step said the library lacks arrives as an issue labelled
# "source-request" (src/lib/case-system/retrieval/sourceRequests.ts). This
# resolves it to the official text, fetches it and keeps it only if the text
# carries its own title and the current-consolidation line, indexes it,
# checks the corpus suites, and merges it -- so the next person's research can
# quote it. Anything that does not resolve or verify is left on the issue
# for a person, labelled needs-human; nothing unverified is ever vendored.
#
# Can also be run by hand with a law's name.
#
# NEEDS the repository setting Settings > Actions > General > "Allow GitHub
# Actions to create and approve pull requests" (on since 2026-10-05). Without
# it everything up to the merge works and the PR step is refused (403).

on:
  # Only "labeled": an issue created with the label fires both "opened" and
  # "labeled", and the second run found the law just added and flagged the
  # request for a person (first live request, #130, 2026-10-05). Adding the
  # label to an existing issue by hand still fires this.
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      request:
        description: "The law to add, e.g. Statutory Accident Benefits Schedule, O. Reg. 34/10"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: source-requests
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'source-request' && github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the .doc and PDF text extractors
        run: sudo apt-get update -q && sudo apt-get install -y -q antiword poppler-utils

      - name: The request
        id: request
        env:
          TITLE: ${{ github.event.issue.title }}
          MANUAL: ${{ inputs.request }}
        run: |
          name="${MANUAL:-${TITLE#Source request: }}"
          # One line, no shell metacharacters reach a command line.
          name="$(printf '%s' "$name" | tr -d '\r\n`$\\' | cut -c1-200)"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Resolve to an official source
        id: resolve
        env:
          NAME: ${{ steps.request.outputs.name }}
        run: |
          out="$(npx tsx scripts/sources/resolveSourceRequest.ts "$NAME" | tail -1)"
          echo "$out"
          echo "result=$out" >> "$GITHUB_OUTPUT"
          echo "::notice title=Resolve::$out"

      - name: Fetch and verify
        id: fetch
        if: startsWith(steps.resolve.outputs.result, 'id=')
        run: |
          id="${{ steps.resolve.outputs.result }}"; id="${id#id=}"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          npx tsx scripts/rules/fetchCorpus.ts --only "$id" 2>&1 | tee fetch.log
          if node -e "const m=require('./docs/sources/corpus/manifest.json'); process.exit(m.entries.some(e=>e.id==='$id')?0:1)"; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
          else
            reason="$(grep -m1 -iE 'fail|missing|not contain|minimum' fetch.log | cut -c1-200)"
            echo "verified=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=Fetch::$id did not verify: $reason"
          fi

      - name: Index and check
        id: index
        if: steps.fetch.outputs.verified == 'yes'
        run: |
          npm run retrieval:index
          npm run test:rules-corpus
          npm run test:corpus-retrieval

      - name: Merge
        id: merge
        if: steps.index.outcome == 'success'
        env:
          ID: ${{ steps.fetch.outputs.id }}
          NAME: ${{ steps.request.outputs.name }}
        run: |
          set -euo pipefail
          branch="source-request-${GITHUB_RUN_ID}"
          git config user.name "source-requests-bot"
          git config user.email "source-requests-bot@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add scripts/rules/requestedSources.json docs/sources/corpus docs/sources/retrieval
          git commit -q -m "Add $ID to the library (source request${ISSUE:+ #$ISSUE})"
          git push -q origin "$branch"
          body="Requested by the research step as: $NAME. Resolved, fetched from the official site, verified by its own title and consolidation line, indexed; rules-corpus and corpus-retrieval suites passed."
          pr="$(gh api repos/${GITHUB_REPOSITORY}/pulls -f title="Add $ID to the library" -f head="$branch" -f base=main -f body="$body" --jq .number)"
          gh api -X PUT repos/${GITHUB_REPOSITORY}/pulls/$pr/merge -f merge_method=squash >/dev/null
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "::notice title=Merged::$ID added (PR #$pr)"

      - name: Report on the issue
        if: always() && github.event_name == 'issues'
        env:
          RESULT: ${{ steps.resolve.outputs.result }}
          VERIFIED: ${{ steps.fetch.outputs.verified }}
          PR: ${{ steps.merge.outputs.pr }}
        run: |
          if [ -n "$PR" ]; then
            gh api repos/${GITHUB_REPOSITORY}/issues/$ISSUE/comments -f body="Added to the library in #$PR (${RESULT#id=}). Research can now find and quote it." >/dev/null
            gh api -X PATCH repos/${GITHUB_REPOSITORY}/issues/$ISSUE -f state=closed >/dev/null
          elif [[ "$RESULT" == in-library=* ]]; then
            gh api repos/${GITHUB_REPOSITORY}/issues/$ISSUE/comments -f body="This law is already in the library (${RESULT#in-library=}). The research step did not find the provision it needed in it, which is a search problem, not a missing source. Left open for a person." >/dev/null
            gh api repos/${GITHUB_REPOSITORY}/issues/$ISSUE/labels -f "labels[]=needs-human" >/dev/null
          else
            gh api repos/${GITHUB_REPOSITORY}/issues/$ISSUE/comments -f body="Could not add this automatically (${RESULT:-no result}${VERIFIED:+, verified=$VERIFIED}). Nothing was vendored. Left open for a person." >/dev/null
            gh api repos/${GITHUB_REPOSITORY}/issues/$ISSUE/labels -f "labels[]=needs-human" >/dev/null
          fi
