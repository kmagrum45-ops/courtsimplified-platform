name: CourtSimplified Source Requests

# A law the research step said the library lacks arrives as an issue labelled
# "source-request" (src/lib/case-system/retrieval/sourceRequests.ts). This
# resolves it to the official text, fetches it and keeps it only if the text
# carries its own title and the current-consolidation line, indexes it,
# checks the corpus suites, and merges it -- so the next person's research can
# quote it. Anything that does not resolve or verify is left on the issue
# for a person, labelled needs-human; nothing unverified is ever vendored.
#
# EACH RUN SWEEPS EVERY OPEN REQUEST (2026-10-05). GitHub keeps one running
# and one pending run per concurrency group and cancels older pending ones, so
# a burst of requests handled one per run would lose most of them. A run now
# processes every open request not marked needs-human, and indexes and merges
# them together (scripts/sources/processSourceRequests.sh).
#
# Can also be run by hand with a law's name.
#
# NEEDS the repository setting Settings > Actions > General > "Allow GitHub
# Actions to create and approve pull requests" (on since 2026-10-05). Without
# it everything up to the merge works and the PR step is refused (403).

on:
  # Only "labeled": an issue created with the label fires "opened" and
  # "labeled", and the second run found the law just added and flagged the
  # request for a person (first live request, #130, 2026-10-05). Adding the
  # label to an existing issue by hand still fires this.
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      request:
        description: "The law to add, e.g. Statutory Accident Benefits Schedule, O. Reg. 34/10 (blank: every open request)"
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: source-requests
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'source-request' && github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the .doc and PDF text extractors
        run: sudo apt-get update -q && sudo apt-get install -y -q antiword poppler-utils

      - name: Collect the open requests
        id: collect
        env:
          MANUAL: ${{ inputs.request }}
        run: |
          if [ -n "${MANUAL:-}" ]; then
            printf '0\t%s\n' "$MANUAL" > requests.raw
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=source-request&per_page=50" \
              --jq '.[] | select(([.labels[].name] | index("needs-human")) | not) | [(.number|tostring), (.title | sub("^Source request: "; ""))] | @tsv' > requests.raw
          fi
          # One line each; no shell metacharacters reach a command line.
          tr -d '\r`$\\' < requests.raw | cut -c1-220 > requests.tsv
          echo "count=$(grep -c . requests.tsv || true)" >> "$GITHUB_OUTPUT"
          cat requests.tsv

      - name: Fetch and verify
        id: fetch
        if: steps.collect.outputs.count != '0'
        run: |
          # Notes go to stderr so they reach the log and annotations; only
          # the last stdout line is the step's output.
          out="$(bash scripts/sources/processSourceRequests.sh requests.tsv results.tsv | tail -1)"
          echo "$out" >> "$GITHUB_OUTPUT"
          for f in fetch-*.log; do [ -f "$f" ] && { echo "== $f"; tail -8 "$f"; }; done
          cat results.tsv

      - name: Index and check
        id: index
        if: steps.fetch.outputs.verified == 'yes'
        # A failure here used to say only "indexing or the corpus checks
        # failed" (nine requests, 2026-10-06), and job logs are not readable
        # everywhere the result is read. The failing lines now go out as
        # annotations and into failure.txt, which the report puts on each issue.
        run: |
          set -o pipefail
          for step in retrieval:index test:rules-corpus test:corpus-retrieval; do
            if ! npm run "$step" 2>&1 | tee step.log; then
              { echo "$step failed:"; grep -E -A4 'FAIL|Error|error:' step.log | head -20; } > failure.txt
              [ -s failure.txt ] || tail -15 step.log >> failure.txt
              while IFS= read -r line; do echo "::error title=$step::${line:0:300}"; done < failure.txt
              exit 1
            fi
          done

      - name: Merge
        id: merge
        if: steps.index.outcome == 'success'
        run: |
          set -euo pipefail
          branch="source-request-${GITHUB_RUN_ID}"
          ids="$(grep -oP 'vendored:\K\S+' results.tsv | sort -u | tr '\n' ' ')"
          git config user.name "source-requests-bot"
          git config user.email "source-requests-bot@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add scripts/rules/requestedSources.json docs/sources/corpus docs/sources/retrieval
          git commit -q -m "Add to the library: ${ids}(source requests)"
          git push -q origin "$branch"
          body="Requested by the research step. Each resolved to its official source, fetched, verified by its own title (and, for e-Laws, the current-consolidation line), and indexed; rules-corpus and corpus-retrieval suites passed. Added: ${ids}"
          pr="$(gh api repos/${GITHUB_REPOSITORY}/pulls -f title="Add to the library: ${ids}" -f head="$branch" -f base=main -f body="$body" --jq .number)"
          gh api -X PUT repos/${GITHUB_REPOSITORY}/pulls/$pr/merge -f merge_method=squash >/dev/null
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "::notice title=Merged::${ids}(PR #$pr)"

      - name: Report on each issue
        if: always() && steps.collect.outputs.count != '0'
        env:
          PR: ${{ steps.merge.outputs.pr }}
        run: |
          [ -f results.tsv ] || exit 0
          while IFS=$'\t' read -r num name outcome; do
            [ "$num" = "0" ] && continue
            [ -z "$num" ] && continue
            case "$outcome" in
              vendored:*)
                if [ -n "$PR" ]; then
                  gh api repos/${GITHUB_REPOSITORY}/issues/$num/comments -f body="Added to the library in #$PR (${outcome#vendored:}). Research can now find and quote it." >/dev/null
                  gh api -X PATCH repos/${GITHUB_REPOSITORY}/issues/$num -f state=closed >/dev/null
                else
                  why="$( [ -f failure.txt ] && head -c 1500 failure.txt || echo 'the merge step failed' )"
                  body="$(printf 'Fetched and verified (%s), but nothing was merged. Left open for a person. What failed:\n\n```\n%s\n```' "${outcome#vendored:}" "$why")"
                  gh api repos/${GITHUB_REPOSITORY}/issues/$num/comments -f body="$body" >/dev/null
                  gh api repos/${GITHUB_REPOSITORY}/issues/$num/labels -f "labels[]=needs-human" >/dev/null
                fi
                ;;
              in-library:*)
                gh api repos/${GITHUB_REPOSITORY}/issues/$num/comments -f body="This law is already in the library (${outcome#in-library:}). The research step did not find the provision it needed in it, which is a search problem, not a missing source. Left open for a person." >/dev/null
                gh api repos/${GITHUB_REPOSITORY}/issues/$num/labels -f "labels[]=needs-human" >/dev/null
                ;;
              *)
                gh api repos/${GITHUB_REPOSITORY}/issues/$num/comments -f body="Could not add this automatically (${outcome}). Nothing was vendored. Left open for a person." >/dev/null
                gh api repos/${GITHUB_REPOSITORY}/issues/$num/labels -f "labels[]=needs-human" >/dev/null
                ;;
            esac
          done < results.tsv
