name: CourtSimplified Story Review

# Runs realistic stories through the whole guided intake with real model calls
# and publishes the report to the `story-review-reports` branch
# (REPORT.md + results.json). See scripts/verification/storyReview/runStoryReview.ts.
#
# A review, not a gate: findings never fail this workflow. It fails only if the
# battery could not run.
#
# Runs on demand (Actions tab -> CourtSimplified Story Review -> Run workflow),
# and whenever the battery, the intake or the case review changes on main. It is not run on
# every push: about 800 gpt-4o-mini calls a run (well under a dollar).

# 2026-10-07: manual only. It spends the site's OpenAI balance, which ran
# low; start it from the Actions tab (or ask Claude) when a run is wanted.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: story-review
  cancel-in-progress: false

jobs:
  story-review:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # The audit log goes to a local file, never to a database. No Supabase
      # credentials are given to this job at all.
      AI_CALL_LOG: file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the story review
        run: npm run review:stories

      # CLAUDE.md section 7: intake changes must go through the fixture harness,
      # which needs the real key. Its .actual.md output is published beside the
      # report for comparison with the committed .expected.md files. A failure
      # here is reported, not hidden, and does not stop the report publishing.
      - name: Fixture harness
        id: fixtures
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:fixtures 2>&1 | tee fixture-run.log

      # The stage-resolution eval (scripts/eval/runAccuracyEval.ts): real model
      # calls routing every user type's story to a stage, the deadline cases and
      # the advice deflection. Reported beside the story review, not a gate.
      - name: Accuracy eval
        id: accuracy
        continue-on-error: true
        run: |
          set -o pipefail
          npm run eval:accuracy 2>&1 | tee accuracy-eval.log

      # What meaning-based retrieval finds for fabricated stories in each court
      # (scripts/eval/retrievalProbe.ts). Reported beside the story review.
      - name: Retrieval probe
        id: retrieval
        continue-on-error: true
        run: |
          set -o pipefail
          npm run eval:retrieval 2>&1 | tee retrieval-probe.log

      # Retrieval measured against the labelled set (scripts/eval/
      # retrievalRecallSet.ts): story hit rate, provision recall and time.
      - name: Retrieval recall
        id: recall
        continue-on-error: true
        run: |
          set -o pipefail
          npm run eval:retrieval-recall 2>&1 | tee retrieval-recall.log

      - name: Publish the report to the story-review-reports branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cp scripts/verification/storyReview/REPORT.md scripts/verification/storyReview/results.json "$out/"
          mkdir -p "$out/fixtures"
          cp scripts/verification/fixtures/*.actual.md "$out/fixtures/" || true
          cp fixture-run.log "$out/fixtures/" || true
          echo "fixture harness outcome: ${{ steps.fixtures.outcome }}" > "$out/fixtures/OUTCOME.txt"
          cp accuracy-eval.log "$out/" || true
          cp retrieval-probe.md retrieval-probe.log "$out/" || true
          cp retrieval-recall.md retrieval-recall.json retrieval-recall.log "$out/" || true
          # The model's recorded reasoning on the fabricated eval stories. No
          # user data: this job has no database credentials at all.
          cp .ai-call-log.jsonl "$out/" || true
          echo "accuracy eval outcome: ${{ steps.accuracy.outcome }}" >> "$out/fixtures/OUTCOME.txt"
          echo "retrieval probe outcome: ${{ steps.retrieval.outcome }}" >> "$out/fixtures/OUTCOME.txt"
          echo "retrieval recall outcome: ${{ steps.recall.outcome }}" >> "$out/fixtures/OUTCOME.txt"
          # This branch holds a report, not the site. Without this Vercel tries
          # to build it as a preview, fails, and emails the site owner on every
          # run (2026-09-28). Vercel reads vercel.json from the commit it deploys.
          printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > "$out/vercel.json"
          cd "$out"
          git init -q
          git config user.name "story-review-bot"
          git config user.email "story-review-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Story review for ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/story-review-reports
          echo "Published to story-review-reports." >> "$GITHUB_STEP_SUMMARY"
          head -40 REPORT.md >> "$GITHUB_STEP_SUMMARY"
