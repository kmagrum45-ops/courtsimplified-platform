name: CourtSimplified Retrieval Eval

# Measures meaning-based retrieval on its own, in minutes rather than the
# Story Review's hour: the labelled recall set (scripts/eval/
# retrievalRecallSet.ts) and the probe. Publishes the reports to the
# `retrieval-eval-reports` branch (not the site: "*-reports" is excluded from
# Vercel builds in vercel.json).
#
# Runs on demand -- on any branch, so a retrieval change can be measured
# before it is merged -- and on a push to main that changes retrieval.

# 2026-10-07: manual only. It spends the site's OpenAI balance, which ran
# low; start it from the Actions tab (or ask Claude) when a run is wanted.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if this check already passed on the same code"
        required: false
        default: "no"
      research_only:
        description: "Run only the research-step probe (minutes, for iterating on it)"
        type: boolean
        default: false
      sourced_only:
        description: "Run only the questions-from-the-law probe"
        type: boolean
        default: false
      assistant_only:
        description: "Run only the Court Assistant law probe"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: retrieval-eval
  cancel-in-progress: false

jobs:
  # Skips the run when it already passed on exactly this code (2026-10-08):
  # a marker is saved after a pass, keyed on the code's contents.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: passed
        uses: actions/cache/restore@v4
        with:
          path: .ai-passed
          key: ai-passed-retrieval-eval-${{ hashFiles('src/**', 'app/**', 'scripts/**', 'package-lock.json') }}
          lookup-only: true
      - id: decide
        run: |
          if [ "${{ steps.passed.outputs.cache-hit }}" = "true" ] && [ "${{ inputs.force }}" != "yes" ]; then
            echo "::notice title=Already passed::This check already passed on this exact code; not run again (run with force=yes to override)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  eval:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_CALL_LOG: file
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Stops the run if today's OpenAI spend is over $15 (scripts/ai/spendGuard.mjs, 2026-10-08).
      - name: Check today's OpenAI spend
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
        run: node scripts/ai/spendGuard.mjs

      - run: npm ci

      - name: Retrieval recall
        if: ${{ !inputs.research_only && !inputs.sourced_only && !inputs.assistant_only }}
        id: recall
        continue-on-error: true
        run: |
          set -o pipefail
          npm run eval:retrieval-recall 2>&1 | tee retrieval-recall.log
          tail -1 retrieval-recall.log | sed 's/^/::notice title=Recall::/'

      - name: Retrieval probe
        if: ${{ !inputs.research_only && !inputs.sourced_only && !inputs.assistant_only }}
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          npm run eval:retrieval 2>&1 | tee retrieval-probe.log

      - name: Plain explanations
        if: ${{ !inputs.research_only && !inputs.sourced_only && !inputs.assistant_only }}
        id: explain
        continue-on-error: true
        run: |
          set -o pipefail
          npm run eval:explain 2>&1 | tee explain-probe.log
          tail -1 explain-probe.log | sed 's/^/::notice title=Explanations::/'

      - name: Research step
        id: research
        if: ${{ !inputs.sourced_only && !inputs.assistant_only }}
        continue-on-error: true
        run: |
          set -o pipefail
          npm run eval:research 2>&1 | tee research-probe.log
          tail -1 research-probe.log | sed 's/^/::notice title=Research::/'

      - name: Questions from the law
        id: sourced
        if: ${{ !inputs.research_only && !inputs.assistant_only }}
        continue-on-error: true
        run: |
          set -o pipefail
          npm run eval:sourced-questions 2>&1 | tee sourced-questions-probe.log
          tail -1 sourced-questions-probe.log | sed 's/^/::notice title=Sourced questions::/'

      - name: The law on your question
        id: assistant
        if: ${{ !inputs.research_only && !inputs.sourced_only }}
        continue-on-error: true
        run: |
          set -o pipefail
          npm run eval:assistant-law 2>&1 | tee assistant-law-probe.log
          tail -1 assistant-law-probe.log | sed 's/^/::notice title=Assistant law::/'

      - name: Publish to retrieval-eval-reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cp retrieval-recall.md retrieval-recall.json retrieval-recall.log retrieval-probe.md retrieval-probe.log explain-probe.md explain-probe.log research-probe.md research-probe.log sourced-questions-probe.md sourced-questions-probe.log assistant-law-probe.md assistant-law-probe.log "$out/" 2>/dev/null || true
          printf 'branch: %s\ncommit: %s\nrecall: %s\nprobe: %s\nexplain: %s\n' "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${{ steps.recall.outcome }}" "${{ steps.probe.outcome }}" "${{ steps.explain.outcome }}" > "$out/OUTCOME.txt"
          printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > "$out/vercel.json"
          cd "$out"
          git init -q
          git config user.name "retrieval-eval-bot"
          git config user.email "retrieval-eval-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Retrieval eval for ${GITHUB_SHA::7} on ${GITHUB_REF_NAME} (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/retrieval-eval-reports
          head -8 retrieval-recall.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Record that this check passed on this code
        if: success()
        run: mkdir -p .ai-passed && date -u > .ai-passed/passed
      - if: success()
        uses: actions/cache/save@v4
        with:
          path: .ai-passed
          key: ai-passed-retrieval-eval-${{ hashFiles('src/**', 'app/**', 'scripts/**', 'package-lock.json') }}
