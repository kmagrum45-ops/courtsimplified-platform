name: CourtSimplified Page Walkthrough

# Plays fabricated personas (family, civil and Small Claims, both sides) through
# the real site in a browser, records what every page shows them, has a critic
# review each journey, and publishes REPORT.md + PAGES.md + screenshots to the
# `walkthrough-reports` branch. See tests/browser/walkthrough.spec.ts and
# scripts/walkthrough/critique.ts.
#
# A review, not a gate: page problems never fail this workflow. It fails only
# if it could not run, or if the database it would use is production.

# 2026-10-07: manual only. It spends the site's OpenAI balance, which ran
# low; start it from the Actions tab (or ask Claude) when a run is wanted.
on:
  workflow_dispatch:
    inputs:
      personas:
        description: "Only these cases, comma-separated ids from tests/browser/walkthrough/personas.ts; blank = all 20"
        required: false
        default: ""
      set:
        description: "tuning (the 20 cases) or held-back (the 10 finish-line cases in heldBackPersonas.ts, run only to measure)"
        required: false
        default: "tuning"
      effort:
        description: "Reasoning effort for the site under test: low (cheaper; default) or medium (as the live site runs, for the finish-line check)"
        required: false
        default: "low"
      force:
        description: "Run even if this check already passed on the same code"
        required: false
        default: "no"
permissions:
  contents: write

# Queue, don't cancel: a run takes ~25 minutes and merges land faster than
# that, so cancelling meant no run ever finished (2026-10-04).
concurrency:
  group: walkthrough
  cancel-in-progress: false

jobs:
  # Skips the run when it already passed on exactly this code (2026-10-08):
  # a marker is saved after a pass, keyed on the code's contents.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: passed
        uses: actions/cache/restore@v4
        with:
          path: .ai-passed
          key: ai-passed-walkthrough-${{ inputs.set }}-${{ hashFiles('src/**', 'app/**', 'scripts/**', 'package-lock.json') }}
          lookup-only: true
      - id: decide
        run: |
          if [ "${{ steps.passed.outputs.cache-hit }}" = "true" ] && [ "${{ inputs.force }}" != "yes" ]; then
            echo "::notice title=Already passed::This check already passed on this exact code; not run again (run with force=yes to override)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # 20 personas in 5 parallel jobs of 4 (2026-10-07; one runner took ~2 hours
  # for 8). Each job plays its share; the `report` job merges them, runs the
  # critic once, and publishes.
  walkthrough:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: 1
      # Staging only. The repository's NEXT_PUBLIC_SUPABASE_* secrets point at
      # PRODUCTION (found 2026-10-04 by the guard below), so the STAGING_*
      # secrets are read first and the guard refuses production by ref.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Not a test of answer quality, so the model thinks less (2026-10-08); set
      # the repository variable AI_TEST_MODEL to use a cheaper model as well.
      AI_MODEL_DEEP: ${{ vars.AI_TEST_MODEL }}
      AI_MODEL_STANDARD: ${{ vars.AI_TEST_MODEL }}
      AI_EFFORT_DEEP: ${{ inputs.effort == 'medium' && 'medium' || 'low' }}
      AI_EFFORT_STANDARD: low
      # Audit rows go to a local file, never to a database.
      AI_CALL_LOG: file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Stops the run if today's OpenAI spend is over $15 (scripts/ai/spendGuard.mjs, 2026-10-08).
      - name: Check today's OpenAI spend
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
        run: node scripts/ai/spendGuard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Refuse a production database
        run: node --import tsx scripts/walkthrough/guard.ts

      # The site gate compares a cookie to SITE_ACCESS_PASSWORD. This run makes
      # up its own, masked, used only by this job's own server.
      - name: Site access password for this run only
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "SITE_ACCESS_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start the site
        run: |
          nohup npx next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3100; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "server did not start"; tail -50 server.log; exit 1

      - name: Walk every persona through the site
        id: walk
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
          WALKTHROUGH_SHARD: ${{ matrix.shard }}/5
          WALKTHROUGH_PERSONAS: ${{ inputs.personas }}
          WALKTHROUGH_SET: ${{ inputs.set }}
        run: npx playwright test tests/browser/walkthrough.spec.ts --reporter=line --workers=1

      - name: Keep this share's pages
        if: always()
        run: |
          mkdir -p walkthrough-output
          cp server.log "walkthrough-output/server-${{ matrix.shard }}.log" || true
          echo "${{ steps.walk.outcome }}" > "walkthrough-output/OUTCOME-${{ matrix.shard }}.txt"

      - name: Upload this share
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-${{ matrix.shard }}
          path: walkthrough-output
          retention-days: 3

      - name: Record that this check passed on this code
        if: success()
        run: mkdir -p .ai-passed && date -u > .ai-passed/passed
      - if: success()
        uses: actions/cache/save@v4
        with:
          path: .ai-passed
          key: ai-passed-walkthrough-${{ inputs.set }}-${{ hashFiles('src/**', 'app/**', 'scripts/**', 'package-lock.json') }}

  report:
    needs: walkthrough
    if: always() && needs.walkthrough.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Stops the run if today's OpenAI spend is over $15 (scripts/ai/spendGuard.mjs, 2026-10-08).
      - name: Check today's OpenAI spend
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
        run: node scripts/ai/spendGuard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Gather every share
        uses: actions/download-artifact@v4
        with:
          pattern: walkthrough-*
          path: walkthrough-output
          merge-multiple: true

      - name: Critic review
        run: node --import tsx scripts/walkthrough/critique.ts

      - name: Publish to the walkthrough-reports branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d walkthrough-output ] || { echo "no output"; exit 0; }
          out="$(mktemp -d)"
          cp -r walkthrough-output/. "$out/"
          cat "$out"/OUTCOME-*.txt 2>/dev/null | sort | uniq -c | sed 's/^/walk outcomes: /' > "$out/OUTCOME.txt" || true
          # A report branch, not the site: never let Vercel build it.
          printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > "$out/vercel.json"
          cd "$out"
          git init -q
          git config user.name "walkthrough-bot"
          git config user.email "walkthrough-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Page walkthrough for ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/walkthrough-reports
          echo "Published to walkthrough-reports." >> "$GITHUB_STEP_SUMMARY"
          [ -f FINISH_LINE.md ] && sed -n '1,30p' FINISH_LINE.md >> "$GITHUB_STEP_SUMMARY" || true
          [ -f REPORT.md ] && head -30 REPORT.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Record that this check passed on this code
        if: success()
        run: mkdir -p .ai-passed && date -u > .ai-passed/passed
      - if: success()
        uses: actions/cache/save@v4
        with:
          path: .ai-passed
          key: ai-passed-walkthrough-${{ inputs.set }}-${{ hashFiles('src/**', 'app/**', 'scripts/**', 'package-lock.json') }}
